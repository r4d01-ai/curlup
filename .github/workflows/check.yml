name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck pick.sh
        run: shellcheck -S warning pick.sh
      - name: installers.txt parses cleanly
        run: |
          out=$(./pick.sh -l 2>&1)
          if grep -q 'Skipping malformed' <<< "$out"; then echo "$out" | grep 'Skipping'; exit 1; fi
          echo "$(grep -c . <<< "$out") tools OK"
      - name: works through curl | bash
        run: cat pick.sh | bash -s -- -f installers.txt -d -n uv,kubectl:system
